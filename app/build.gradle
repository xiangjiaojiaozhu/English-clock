plugins { id 'com.android.application' }
android {
 namespace 'com.xiangjiaojiaozhu.englishclock'; compileSdk 36
 signingConfigs { release { storeFile file('english-clock-release.jks'); storePassword 'EnglishClock2026'; keyAlias 'englishclock'; keyPassword 'EnglishClock2026' } }
 defaultConfig { applicationId 'com.xiangjiaojiaozhu.englishclock'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0' }
 buildTypes { debug { signingConfig signingConfigs.release }; release { signingConfig signingConfigs.release; minifyEnabled false } }
 packaging { resources { excludes += ['/META-INF/DEPENDENCIES','/META-INF/LICENSE','/META-INF/NOTICE'] } }
}
dependencies {
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.android.gms:play-services-tasks:18.2.1'
}
